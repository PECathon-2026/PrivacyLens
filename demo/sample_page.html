<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirExpress — Flight Booking & Checkout</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .badge {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .flight-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .flight-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .route { font-size: 1.1rem; font-weight: 600; }
    .flight-meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
    .fare { font-size: 1.25rem; font-weight: 700; color: #34d399; }

    .section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 1rem; }
    .form-group.full { grid-column: span 2; }
    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    input {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--primary-hover); }
    .status-msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">✈ AirExpress Airlines</div>
      <div class="badge">SECURE CHECKOUT</div>
    </div>

    <!-- Flight Overview (Public Context) -->
    <div class="flight-card" id="flight_summary">
      <div class="flight-summary">
        <div>
          <div class="route" id="flight_route">New Delhi (DEL) → Mumbai (BOM)</div>
          <div class="flight-meta" id="flight_details">Flight AI-502 • Non-stop • Economy Class • Seat 14A</div>
        </div>
        <div class="fare" id="flight_fare">INR 6,450</div>
      </div>
    </div>

    <form id="checkout_form" onsubmit="event.preventDefault(); submitBooking();">
      <!-- Passenger Details Section -->
      <div class="section">
        <div class="section-title">1. Passenger & Contact Information</div>
        <div class="grid">
          <div class="form-group full">
            <label for="passenger_name">Passenger Full Name</label>
            <input type="text" id="passenger_name" name="passenger_name" placeholder="e.g. Rahul Sharma" value="Rahul Sharma">
          </div>
          <div class="form-group">
            <label for="email">Contact Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@domain.test" value="rahul.sharma@example.test">
          </div>
          <div class="form-group">
            <label for="mobile">Phone / Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="+91 9876543210" value="+919876543210">
          </div>
        </div>
      </div>

      <!-- Identity Verification Section -->
      <div class="section">
        <div class="section-title">2. Government Identity Verification</div>
        <div class="grid">
          <div class="form-group">
            <label for="pan_card">PAN Card Number</label>
            <input type="text" id="pan_card" name="pan_card" placeholder="ABCDE1234F" value="ABCPD1234F">
          </div>
          <div class="form-group">
            <label for="aadhaar_number">Aadhaar Card (12 digits)</label>
            <input type="text" id="aadhaar_number" name="aadhaar_number" placeholder="xxxx xxxx xxxx" value="234567890124">
          </div>
        </div>
      </div>

      <!-- Payment Details Section -->
      <div class="section">
        <div class="section-title">3. Payment & Billing Details</div>
        <div class="grid">
          <div class="form-group full">
            <label for="card_number">Debit / Credit Card Number</label>
            <input type="text" id="card_number" name="card_number" placeholder="4532 0151 1283 0366" value="4532015112830366">
          </div>
          <div class="form-group">
            <label for="card_expiry">Expiry Date (MM/YY)</label>
            <input type="text" id="card_expiry" name="card_expiry" placeholder="12/28" value="12/28">
          </div>
          <div class="form-group">
            <label for="cvv">Security Code (CVV)</label>
            <input type="password" id="cvv" name="cvv" placeholder="***" value="842">
          </div>
        </div>
      </div>

      <!-- Submit Button (Consequential Action) -->
      <button type="submit" id="btn_submit_booking" class="btn-submit">
        Authorize & Confirm Booking (INR 6,450)
      </button>

      <div id="status_alert" class="status-msg"></div>
    </form>
  </div>

  <script>
    function submitBooking() {
      const statusDiv = document.getElementById('status_alert');
      const name = document.getElementById('passenger_name').value;
      const card = document.getElementById('card_number').value;
      const cardMasked = card ? 'ending in ' + card.slice(-4) : 'N/A';

      statusDiv.style.display = 'block';
      statusDiv.style.background = 'rgba(16, 185, 129, 0.2)';
      statusDiv.style.border = '1px solid rgba(16, 185, 129, 0.5)';
      statusDiv.style.color = '#34d399';
      statusDiv.innerHTML = `<strong>Booking Confirmed!</strong> Ticket issued for <em>${name}</em>. Charged to card ${cardMasked}.`;
    }
  </script>
</body>
</html>
